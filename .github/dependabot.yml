version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  # Add an entry for each package ecosystem your project uses, for example:
  # - package-ecosystem: <ecosystem>
  #   directory: /
  #   schedule:
  #     interval: weekly
