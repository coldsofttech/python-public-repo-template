name: CI package

# The library: lint, tests, integration tests and build. Called by ci.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  package-lint:
    name: package lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: ./.github/actions/setup-uv
      - name: Lint
        uses: ./.github/actions/lint-python
      - name: Check dependency licenses
        run: uv run --with pip-licenses pip-licenses --from=mixed --partial-match --fail-on="GPL" --format=plain

  package-test:
    name: package test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest # Apple silicon
            python-version: "3.11"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Run tests
        uses: ./.github/actions/run-pytest
        with:
          python-version: ${{ matrix.python-version }}

  package-int-test:
    name: package int-test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest # Apple silicon
            python-version: "3.11"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Run integration tests
        uses: ./.github/actions/run-pytest
        with:
          python-version: ${{ matrix.python-version }}
          integration: "true"

  package-build:
    name: package build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          sync: "false"
      - name: Build the package
        run: uv build
      - name: Check the package metadata
        run: uvx twine check --strict dist/*
