name: CI

# Calls ci-package.yml for the library (src/ and tests/) and ci-repo.yml for the rest of the
# repository; `ci` at the end is the single required check for the branch ruleset. On pull
# requests, `changes` limits the run to the parts of the repository the change can affect; every
# other event runs everything.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  package:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    uses: ./.github/workflows/ci-package.yml

  repo:
    needs: changes
    if: needs.changes.outputs.repo == 'true'
    uses: ./.github/workflows/ci-repo.yml

  ci:
    if: always()
    needs: [changes, package, repo]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          # A job skipped because its part of the repository did not change counts as passed.
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null
