name: Audit Python dependencies
description: Export the locked dependencies and check them for known vulnerabilities. Run after checkout.

inputs:
  extra-args:
    description: Extra arguments for `uv export`, for example --all-groups.
    default: ""

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: ./.github/actions/setup-uv
      with:
        sync: "false"
    - name: Export locked dependencies
      shell: bash
      env:
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: uv export --locked $EXTRA_ARGS --no-emit-project --no-hashes --format requirements-txt -o requirements-audit.txt
    - name: Audit
      shell: bash
      run: uvx pip-audit --requirement requirements-audit.txt --no-deps --disable-pip
